        /* Status calendar specific styles */
        .status-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .status-header { text-align: center; margin-bottom: 60px; }
        .status-header h1 { font-size: 3.5rem; font-weight: 200; color: white; margin-bottom: 1.5rem; }

        .back-btn { background: transparent; color: white; border: 1px solid white; padding: 12px 24px; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; text-decoration: none; display: inline-block; margin-top: 30px; }
        .back-btn:hover { background-color: #0000cc; transform: translateY(-2px); }
        
        .calendar-controls { background: #252525; padding: 30px; border-radius: 15px; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 25px; }
        .month-selector { display: flex; align-items: center; gap: 20px; }
        .nav-btn { background: #333; color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 1.3rem; transition: all 0.3s ease; }
        .nav-btn:hover { background: #555; transform: translateY(-2px); }
        .nav-btn:disabled { background: #333; cursor: not-allowed; opacity: 0.5; }
        .current-month { font-size: 1.8rem; font-weight: 600; color: white; min-width: 250px; text-align: center; }
        .view-toggle { display: flex; gap: 15px; }
        .view-btn { background: #1a1a1a; color: #ccc; border: 1px solid #333; padding: 12px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .view-btn.active { background: #333; color: white; border-color: #333; }
        .view-btn:hover { background: #333; color: white; }
        
        .calendar { background: #252525; padding: 40px; border-radius: 15px; margin-bottom: 40px; }
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; margin-bottom: 25px; }
        .calendar-header > div { text-align: center; font-weight: 600; color: #ccc; padding: 15px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; }
        .calendar-day { aspect-ratio: 1; border: 1px solid #333; border-radius: 10px; padding: 15px; cursor: pointer; transition: all 0.3s ease; position: relative; display: flex; flex-direction: column; justify-content: space-between; background: #1a1a1a; }
        .calendar-day:hover { border-color: #555; box-shadow: 0 4px 15px rgba(85, 85, 85, 0.2); transform: translateY(-2px); }
        .calendar-day.other-month { background: #0a0a0a; color: #666; }
        .calendar-day.today { background: rgba(85, 85, 85, 0.1); border-color: #555; }
        .day-number { font-weight: 600; font-size: 1.2rem; color: white; }
        .status-indicators { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #1a1a1a; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .status-dot.operational { background: #28a745; }
        .status-dot.maintenance { background: #0000ef; }
        .status-dot.incident { background: #ffc107; }
        .status-dot.outage { background: #dc3545; }
        .status-dot.notice { background: #6f42c1; }
        .event-count { position: absolute; top: 8px; right: 8px; background: #333; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #252525; margin: 5% auto; padding: 40px; border-radius: 15px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; border: 1px solid #333; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid #333; }
        .modal-title { font-size: 1.8rem; font-weight: 600; color: white; }
        .close-btn { background: none; border: none; font-size: 2rem; cursor: pointer; color: #ccc; padding: 5px; transition: color 0.3s ease; }
        .close-btn:hover { color: white; }
        .event-list { margin-top: 25px; }
        .event-item { background: #1a1a1a; padding: 25px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #0000ef; }
        .event-item.maintenance { border-left-color: #0000ef; }
        .event-item.incident { border-left-color: #ffc107; }
        .event-item.outage { border-left-color: #dc3545; }
        .event-item.notice { border-left-color: #6f42c1; }
        .event-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .event-type { font-weight: 600; color: white; }
        .event-time { color: #ccc; font-size: 0.95rem; }
        .event-description { color: #ccc; line-height: 1.6; }
        
        .legend { background: #252525; padding: 30px; border-radius: 15px; }
        .legend h3 { margin-bottom: 20px; color: white; font-size: 1.5rem; }
        .legend-items { display: flex; flex-wrap: wrap; gap: 25px; }
        .legend-item { display: flex; align-items: center; gap: 10px; }
        .legend-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #1a1a1a; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .legend-item span { color: #ccc; font-weight: 500; }

            .day-number { font-size: 1rem; }

    <script>
        class StatusCalendar {
            constructor() {
                this.currentDate = new Date();
                this.currentView = 'month';
                this.events = this.generateSampleEvents();
                this.init();
            }

            init() {
                this.renderCalendar();
                this.bindEvents();
            }

            bindEvents() {
                document.getElementById('prevMonth').addEventListener('click', () => this.previousMonth());
                document.getElementById('nextMonth').addEventListener('click', () => this.nextMonth());
                document.getElementById('closeModal').addEventListener('click', () => this.closeModal());
                
                // View toggle
                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentView = e.target.dataset.view;
                        this.renderCalendar();
                    });
                });

                // Close modal when clicking outside
                window.addEventListener('click', (e) => {
                    if (e.target.classList.contains('modal')) {
                        this.closeModal();
                    }
                });
            }

            previousMonth() {
                this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                this.renderCalendar();
            }

            nextMonth() {
                this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                this.renderCalendar();
            }

            renderCalendar() {
                const month = this.currentDate.getMonth();
                const year = this.currentDate.getFullYear();
                
                document.getElementById('currentMonth').textContent = this.getMonthName(month) + ' ' + year;
                
                const calendarGrid = document.getElementById('calendarGrid');
                calendarGrid.innerHTML = '';
                
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const startDate = new Date(firstDay);
                startDate.setDate(startDate.getDate() - firstDay.getDay());
                
                const today = new Date();
                
                for (let i = 0; i < 42; i++) {
                    const currentDate = new Date(startDate);
                    currentDate.setDate(startDate.getDate() + i);
                    
                    const dayElement = this.createDayElement(currentDate, month, today);
                    calendarGrid.appendChild(dayElement);
                }
            }

            createDayElement(date, currentMonth, today) {
                const dayDiv = document.createElement('div');
                const dayNumber = date.getDate();
                const isCurrentMonth = date.getMonth() === currentMonth;
                const isToday = this.isSameDate(date, today);
                
                dayDiv.className = 'calendar-day';
                if (!isCurrentMonth) dayDiv.classList.add('other-month');
                if (isToday) dayDiv.classList.add('today');
                
                const dateString = this.formatDate(date);
                const dayEvents = this.getEventsForDate(dateString);
                
                dayDiv.innerHTML = `
                    <div class="day-number">${dayNumber}</div>
                    ${dayEvents.length > 0 ? `<div class="event-count">${dayEvents.length}</div>` : ''}
                    <div class="status-indicators">
                        ${this.getStatusIndicators(dayEvents)}
                    </div>
                `;
                
                if (dayEvents.length > 0) {
                    dayDiv.addEventListener('click', () => this.showEventDetails(dateString, dayEvents));
                }
                
                return dayDiv;
            }

            getStatusIndicators(events) {
                const statuses = [...new Set(events.map(e => e.type))];
                return statuses.map(status => 
                    `<div class="status-dot ${status}" title="${status}"></div>`
                ).join('');
            }

            getEventsForDate(dateString) {
                return this.events.filter(event => event.date === dateString);
            }

            showEventDetails(dateString, events) {
                const modal = document.getElementById('eventModal');
                const modalTitle = document.getElementById('modalTitle');
                const modalBody = document.getElementById('modalBody');
                
                modalTitle.textContent = `Events for ${this.formatDateForDisplay(dateString)}`;
                
                modalBody.innerHTML = events.map(event => `
                    <div class="event-item ${event.type}">
                        <div class="event-header">
                            <span class="event-type">${event.title}</span>
                            <span class="event-time">${event.time}</span>
                        </div>
                        <div class="event-description">${event.description}</div>
                    </div>
                `).join('');
                
                modal.style.display = 'block';
            }

            closeModal() {
                document.getElementById('eventModal').style.display = 'none';
            }

            formatDate(date) {
                return date.toISOString().split('T')[0];
            }

            formatDateForDisplay(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            }

            getMonthName(month) {
                const months = [
                    'January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'
                ];
                return months[month];
            }

            isSameDate(date1, date2) {
                return date1.toDateString() === date2.toDateString();
            }

            generateSampleEvents() {
                return [
                    {
                        date: '2024-12-15',
                        type: 'maintenance',
                        title: 'Scheduled Maintenance - Ingest Service',
                        time: '2:00 AM - 4:00 AM EST',
                        description: 'Planned maintenance window for database optimization and performance improvements.'
                    },
                    {
                        date: '2024-12-15',
                        type: 'notice',
                        title: 'New Feature Release',
                        time: '10:00 AM EST',
                        description: 'Enhanced analytics dashboard and improved conversation threading capabilities.'
                    },
                    {
                        date: '2024-12-20',
                        type: 'incident',
                        title: 'Login Service Degradation',
                        time: '3:30 PM - 5:15 PM EST',
                        description: 'Investigating increased login response times. Service remained operational with degraded performance.'
                    },
                    {
                        date: '2024-12-22',
                        type: 'maintenance',
                        title: 'Infrastructure Update',
                        time: '1:00 AM - 3:00 AM EST',
                        description: 'Routine security patches and infrastructure improvements.'
                    },
                    {
                        date: '2024-12-25',
                        type: 'notice',
                        title: 'Holiday Support Schedule',
                        time: 'All Day',
                        description: 'Reduced support hours during holiday period. Emergency support remains available.'
                    }
                ];
            }
        }

        // Initialize the calendar when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new StatusCalendar();
        });
    </script>
